<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CORPUS-MOCAP — Compagnon mobile</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: sans-serif; height: 100%; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
  video { visibility: hidden; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; background: rgba(0,0,0,0.55); font-size: 15px; line-height: 1.5; z-index: 10; }
  #status { font-weight: bold; }
  .ok { color: #4caf50; }
  .bad { color: #e53935; }
  .warn { color: #ffb300; }
  #startBtn { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 14px 28px; font-size: 18px; border-radius: 8px; border: none; background: #4caf50; color: white; z-index: 10; }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="hud">
    CORPUS-MOCAP — Compagnon mobile<br>
    Caméra : <span id="camName">—</span><br>
    Rôle(s) : <span id="roles">—</span><br>
    Serveur : <span id="wsAddress">—</span><br>
    Connexion : <span id="wsStatus" class="bad">déconnecté</span><br>
    Détection : <span id="status" class="bad">en attente</span>
  </div>
  <button id="startBtn">Démarrer la caméra</button>
</div>

<script type="module">
import { PoseLandmarker, FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const drawingUtils = new DrawingUtils(ctx);
const statusEl = document.getElementById("status");
const wsStatusEl = document.getElementById("wsStatus");
const wsAddressEl = document.getElementById("wsAddress");
const camNameEl = document.getElementById("camName");
const rolesEl = document.getElementById("roles");
const startBtn = document.getElementById("startBtn");

// Adresse du serveur WebSocket : déduite du nom d'hôte de CETTE page
// (même machine, juste un port différent) par défaut — c'est le cas
// normal, voir phone_server.py qui n'imprime plus d'URL avec un
// paramètre ?ws=... précisément pour éviter de recopier à la main une
// adresse plus longue (source d'erreur constatée en test réel : IP
// différente entre l'hôte de la page et un ?ws= resté d'une session
// précédente). Un paramètre ?ws=hôte:port explicite reste supporté si
// vous avez lancé phone_server.py avec des ports personnalisés.
const params = new URLSearchParams(location.search);
const wsAddress = params.get("ws") || `${location.hostname}:8766`;
wsAddressEl.textContent = wsAddress;

// Nom de caméra (voir camera_config.py) : identifie quel rôle ce
// téléphone joue dans une configuration multi-caméra (ex. "mains" pour
// un téléphone dédié aux mains) — transmis au serveur WebSocket via
// ?cam=<nom> pour qu'il range cette connexion dans le bon créneau
// nommé. Absent (mode historique, un seul téléphone) : le serveur
// utilise un créneau générique.
const camName = params.get("cam");
camNameEl.textContent = camName || "(par défaut, non nommée)";

// Quel(s) détecteur(s) MediaPipe.js charger sur CE téléphone (voir
// phone_server.py:start(), qui génère ces paramètres depuis
// "pose"/"face" de camera_config.py). Sans paramètre de rôle du tout
// (mode historique, un seul téléphone — `server.py --source phone`) :
// pose uniquement, pour rester compatible avec les URLs déjà notées
// avant l'ajout du visage.
const wantPose = params.get("pose") === "1" || (!params.has("pose") && !params.has("face"));
const wantFace = params.get("face") === "1";
rolesEl.textContent = [wantPose && "corps", wantFace && "visage"].filter(Boolean).join(" + ") || "—";

let ws = null;
let poseLandmarker = null;
let faceLandmarker = null;
let running = false;

// Connexions squelette (mêmes paires que capture_server/server.py:POSE_CONNECTIONS)
const POSE_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,7],[0,4],[4,5],[5,6],[6,8],[9,10],
  [11,12],[11,13],[13,15],[15,17],[15,19],[15,21],[17,19],
  [12,14],[14,16],[16,18],[16,20],[16,22],[18,20],
  [11,23],[12,24],[23,24],
  [23,25],[25,27],[27,29],[27,31],[29,31],
  [24,26],[26,28],[28,30],[28,32],[30,32],
];

function connectWebSocket() {
  // La page est servie en HTTPS (certificat auto-signé, voir
  // phone_server.py) : le WebSocket doit être en WSS (sécurisé), un
  // navigateur bloque une connexion ws:// non sécurisée depuis une page
  // https://. Le même certificat couvre le port WebSocket — visitez son
  // URL une fois pour accepter l'avertissement avant d'ouvrir cette page
  // (voir README).
  const wsScheme = location.protocol === "https:" ? "wss" : "ws";
  const camQuery = camName ? `?cam=${encodeURIComponent(camName)}` : "";
  ws = new WebSocket(`${wsScheme}://${wsAddress}/${camQuery}`);
  ws.onopen = () => { wsStatusEl.textContent = "connecté"; wsStatusEl.className = "ok"; };
  ws.onclose = () => {
    wsStatusEl.textContent = "déconnecté — nouvelle tentative...";
    wsStatusEl.className = "bad";
    setTimeout(connectWebSocket, 2000);
  };
  ws.onerror = () => { ws.close(); };
}

function drawSkeleton(landmarks) {
  ctx.strokeStyle = "#4caf50";
  ctx.fillStyle = "#4caf50";
  ctx.lineWidth = 3;
  for (const [a, b] of POSE_CONNECTIONS) {
    const pa = landmarks[a], pb = landmarks[b];
    ctx.beginPath();
    ctx.moveTo(pa.x * canvas.width, pa.y * canvas.height);
    ctx.lineTo(pb.x * canvas.width, pb.y * canvas.height);
    ctx.stroke();
  }
  for (const p of landmarks) {
    ctx.beginPath();
    ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, 2 * Math.PI);
    ctx.fill();
  }
}

// Sous-matrice de rotation 3x3 (9 floats, ligne par ligne) extraite de
// facialTransformationMatrixes — même format que extract_head_rotation()
// dans server.py (côté webcam PC), pour que l'addon (bone_mapping) n'ait
// pas à distinguer la provenance de la donnée. La Matrix de MediaPipe.js
// (4x4, propriété "data") est documentée en column-major : élément
// (ligne, colonne) = data[colonne * 4 + ligne].
// NOTE (non vérifié en conditions réelles) : l'orientation résultante
// n'a pas encore été testée sur un vrai téléphone — si la tête semble
// tourner dans le mauvais sens une fois pilotée dans Blender, comparer
// avec extract_head_rotation() côté Python (webcam) pour ajuster.
function extractHeadRotation(matrixes) {
  if (!matrixes || matrixes.length === 0) return null;
  const { data, rows } = matrixes[0];
  const get = (r, c) => data[c * rows + r];
  const out = [];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) out.push(get(r, c));
  }
  return out;
}

function loop() {
  if (!running) return;
  const nowMs = performance.now();
  let poseOk = false;
  let faceOk = false;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (poseLandmarker) {
    const result = poseLandmarker.detectForVideo(video, nowMs);
    if (result.landmarks && result.landmarks.length > 0) {
      const lm = result.landmarks[0];
      const landmarks = lm.map((p) => ({
        x: p.x, y: p.y, z: p.z,
        visibility: p.visibility !== undefined ? p.visibility : 1.0,
      }));
      drawSkeleton(lm);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "pose", landmarks }));
      }
      poseOk = true;
    }
  }

  if (faceLandmarker) {
    const result = faceLandmarker.detectForVideo(video, nowMs);
    const faceLm = result.faceLandmarks && result.faceLandmarks.length > 0 ? result.faceLandmarks[0] : null;
    if (faceLm) {
      // Maillage complet (468 points) affiché en overlay, pour vérifier
      // visuellement le cadrage/la qualité de détection sur le téléphone
      // lui-même (même principe que drawSkeleton pour le corps).
      drawingUtils.drawConnectors(faceLm, FaceLandmarker.FACE_LANDMARKS_TESSELATION, {
        color: "#C0C0C070", lineWidth: 1,
      });
    }
    if (result.faceBlendshapes && result.faceBlendshapes.length > 0) {
      const blendshapes = {};
      for (const cat of result.faceBlendshapes[0].categories) {
        blendshapes[cat.categoryName] = cat.score;
      }
      const headRotation = extractHeadRotation(result.facialTransformationMatrixes);
      // "points" (x/y uniquement, pas de z/index) : repris tels quels côté
      // PC (voir phone_server.py) uniquement pour dessiner le maillage
      // dans la fenêtre d'aperçu multi-caméra — pas utilisé par l'addon.
      const points = faceLm ? faceLm.map((p) => ({ x: p.x, y: p.y })) : null;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "face", blendshapes, head_rotation: headRotation, points }));
      }
      faceOk = true;
    }
  }

  const parts = [];
  if (poseLandmarker) parts.push(poseOk ? "corps OK" : "corps perdu");
  if (faceLandmarker) parts.push(faceOk ? "visage OK" : "visage perdu");
  statusEl.textContent = parts.join(" / ");
  statusEl.className = (poseLandmarker && !poseOk) || (faceLandmarker && !faceOk) ? "warn" : "ok";

  requestAnimationFrame(loop);
}

async function start() {
  startBtn.disabled = true;
  startBtn.textContent = "Chargement du modèle...";

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  // Réutilise les mêmes fichiers .task que le pipeline webcam PC (voir
  // phone_server.py:_PhoneClientHTTPHandler, sert capture_server/models/).
  if (wantPose) {
    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "/models/pose_landmarker_lite.task", delegate: "GPU" },
      runningMode: "VIDEO",
      numPoses: 1,
    });
  }
  if (wantFace) {
    faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "/models/face_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO",
      numFaces: 1,
      outputFaceBlendshapes: true,
      outputFacialTransformationMatrixes: true,
    });
  }

  startBtn.textContent = "Activation de la caméra...";
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  connectWebSocket();

  startBtn.style.display = "none";
  running = true;
  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", () => {
  start().catch((err) => {
    statusEl.textContent = "erreur";
    statusEl.className = "bad";
    startBtn.disabled = false;
    startBtn.textContent = "Réessayer";
    alert("Erreur de démarrage : " + err.message + "\n\nVérifiez que vous avez autorisé l'accès à la caméra, et que la page est ouverte en HTTPS ou depuis localhost/un réseau local (requis par le navigateur pour getUserMedia).");
    console.error(err);
  });
});
</script>
</body>
</html>
